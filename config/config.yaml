# ============================================================
# AI-Bid-Agent 配置文件
# 改这个文件就能换站点、换输出目录、切换 mock / 真实抓取
# ============================================================

app:
  name: AI-Bid-Agent
  port: 8000
  # 生成的 Word 落在项目根下 output/
  output_dir: output
  # 指纹去重用的 SQLite
  db_path: data/bidagent.db

crawler:
  # true = 用内置样例数据跑通全链路（不联网，第一版默认）
  # false = 真实 HTTP 抓取（2026-11-27 起启用，合肥公共资源交易中心已校准）
  mock: false
  timeout_seconds: 20
  max_pages: 2
  max_items_per_site: 20
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0 Safari/537.36"

  sites:
    # ============ 已校准可用（2026-11-27 实测） ============
    # 合肥公共资源交易中心：前端 AJAX 接口（EpointWebBuilder），
    # 数据 = {"custom": "<json字符串>" -> infoList[]}，详情页 URL 可按模板构造，
    # 免去逐条 pageredirect 换链。模板占位：{keyword} {page} {start_date} {end_date}
    - code: hefei_gc
      name: 合肥公共资源交易中心·工程建设
      base_url: https://ggzy.hefei.gov.cn
      list_url: "https://ggzy.hefei.gov.cn/EpointWebBuilderService/hfggzyGetGgInfo.action?cmd=getinfojyxxlistZfcg&pageIndex={page}&pageSize=10&siteguid=7eb5f7f1-9041-43ad-8e13-8fcb82ea831a&Categorynum=002001&infoC=&title={keyword}&ggstartdate={start_date}&ggenddate={end_date}&zhaobiaofangshi=&projectno=&hangye=&quyu="
      needs_login: false
      data_format: json
      json_items_path: "custom.infoList"
      json_title_field: title
      json_date_field: infodate
      json_url_template: "/jyxx/002001/{categorynum}/{infodate2.compact}/{infoid}.html"
      json_content_fields: [zhaobiaofangshi, infod, infoa, infob, budgetamount, projectno]
      request_headers:
        Referer: "https://ggzy.hefei.gov.cn/jyxx/002001/engineer2.html"
      enabled: true

    - code: hefei_cg
      name: 合肥公共资源交易中心·政府采购
      base_url: https://ggzy.hefei.gov.cn
      list_url: "https://ggzy.hefei.gov.cn/EpointWebBuilderService/hfggzyGetGgInfo.action?cmd=getinfojyxxlistZfcg&pageIndex={page}&pageSize=10&siteguid=7eb5f7f1-9041-43ad-8e13-8fcb82ea831a&Categorynum=002002&infoC=&title={keyword}&ggstartdate={start_date}&ggenddate={end_date}&zhaobiaofangshi=&projectno=&hangye=&quyu="
      needs_login: false
      data_format: json
      json_items_path: "custom.infoList"
      json_title_field: title
      json_date_field: infodate
      json_url_template: "/jyxx/002002/{categorynum}/{infodate2.compact}/{infoid}.html"
      json_content_fields: [zhaobiaofangshi, infod, infoa, infob, budgetamount, projectno]
      request_headers:
        Referer: "https://ggzy.hefei.gov.cn/jyxx/002002/engineer2.html"
      enabled: true

    # ============ 暂不可用，待后续阶段 ============
    # 中国政府采购网：WAF 对非浏览器客户端连首页都 403（2026-11-27 实测），
    # 属强反爬，等 Playwright 侧车落地后再启用
    - code: ccgp
      name: 中国政府采购网
      base_url: https://www.ccgp.gov.cn
      list_url: "https://search.ccgp.gov.cn/bxsearch?searchtype=1&page_index={page}&bidSort=0&pinMu=0&bidType=0&kw={keyword}"
      needs_login: false
      item_selector: "ul.vT-srch-result-list-bid > li"
      title_selector: "a"
      link_selector: "a"
      date_selector: "span"
      enabled: false

    # 全国公共资源交易平台：deal 子域名已停止解析（2026-11-27 实测 DNS 失败），
    # 现门户 www.ggzy.gov.cn 为 JS 渲染，同属 Playwright 待办
    - code: ggzy
      name: 全国公共资源交易平台
      base_url: http://deal.ggzy.gov.cn
      list_url: "http://deal.ggzy.gov.cn/ds/deal/dealList.jsp?keyword={keyword}&page={page}"
      needs_login: false
      item_selector: ".deal-list li"
      title_selector: "a"
      link_selector: "a"
      date_selector: ".date"
      enabled: false

    # 登录态站点：赛题要求至少 1 个。
    # 当前 needs_login=true 时 HTTP 抓取会直接回报“需 Playwright 侧车”，不静默失败。
    - code: demo_login
      name: 示例会员制招标网
      base_url: https://example-bid-portal.invalid
      list_url: "https://example-bid-portal.invalid/search?kw={keyword}&page={page}"
      needs_login: true
      item_selector: ".result-item"
      title_selector: ".title a"
      link_selector: ".title a"
      date_selector: ".publish-date"
      enabled: false

intent:
  # rule   = 正则规则（零成本零依赖）
  # llm    = 全部走大模型（key 放 secrets.yaml 的 intent.llm 或环境变量 BIDAGENT_LLM_API_KEY）
  # hybrid = 规则先行，仅关键词缺失/疑似有频率但没解出 cron 时才调模型补空缺（推荐，调用量趋近于零）
  parser: hybrid
  llm:
    api_key: ""    # 留空 = 未启用；真实 key 放 secrets.yaml 同名段
    base_url: "https://api.deepseek.com/v1"   # 豆包: https://ark.cn-beijing.volces.com/api/v3；千问: https://dashscope.aliyuncs.com/compatible-mode/v1
    model: "deepseek-chat"                    # 豆包填推理接入点 ID（ep- 开头）；千问填 qwen-plus 等

doc:
  font_cn: 宋体
  font_en: Times New Roman
  max_chars_per_item: 600

schedule:
  enabled: true
  timezone: Asia/Shanghai

# 邮件推送：文档生成后自动把 Word + 摘要发到邮箱（增量语义：无新增不出文档、不发邮件）
push:
  email:
    # 默认开启：缺凭据时 ready=false（页面提示「缺凭据」），不会尝试发信、不产生报错
    # 真值（发件邮箱/授权码/收件人）填到 config/secrets.yaml，本段保持空壳即可
    enabled: true
    smtp_host: ""      # 留空按发件邮箱域名自动推断（qq/163/126/gmail/outlook…）
    smtp_port: 0       # 0 = 自动（465 走 SSL，587 走 STARTTLS）
    username: ""       # 发件邮箱，如 xxx@qq.com
    password: ""       # 授权码【不要写在这里】——填到 config/secrets.yaml（已 gitignore）
    from_addr: ""      # 留空 = username
    to_addrs: []       # 收件人列表，可多个
    max_items_in_digest: 8
    timeout_seconds: 20
