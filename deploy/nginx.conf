# 部署形态：nginx 静态托管 + /api 反向代理
# 状态：本机已实测（Docker Desktop 29.9.3，2026-11-27；80 端口返回 200、/api/health 通）
# 配套：docker-compose.yml 把 frontend/dist 挂到 /usr/share/nginx/html

server {
    listen 80;
    server_name _;

    # ===== 门禁（Basic Auth）：只在需要放宽到局域网/公网时启用 =====
    # 现状：docker-compose.yml 已把端口绑死 127.0.0.1，本机之外打不开，故默认关闭。
    # 启用步骤（要给同事/评委访问时）：
    #   1) 生成口令文件（首次拉 httpd 镜像，约 60MB，仅用于生成）：
    #      docker run --rm httpd:2.4-alpine htpasswd -nbB <用户名> <密码> > deploy/htpasswd
    #   2) 放开端口：docker-compose.yml 的 ports 改成 "80:80"
    #   3) 挂载口令文件：nginx 服务 volumes 增加  ./htpasswd:/etc/nginx/htpasswd:ro
    #   4) 取消下面两行注释，重建：docker compose -f deploy/docker-compose.yml up -d
    # 注意：htpasswd 含明文口令的哈希，不要提交进仓库（.gitignore 已排除 deploy/htpasswd）。
    # auth_basic "AI-Bid-Agent";
    # auth_basic_user_file /etc/nginx/htpasswd;

    # gzip 压缩 JS/CSS（演示产物 gzip 后 30KB，直传更小）
    gzip on;
    gzip_types text/css application/javascript application/json;

    # 前端静态资源：SPA 无路由，缺失路径统一回 index.html
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # API 反代到 app 容器（compose 内部网络服务名 app）
    location /api/ {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # 生产对外时在此终结 TLS（证书路径自行替换）
    # listen 443 ssl;
    # ssl_certificate     /etc/nginx/certs/fullchain.pem;
    # ssl_certificate_key /etc/nginx/certs/privkey.pem;
}
