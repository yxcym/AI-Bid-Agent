# 部署形态示例：nginx 静态托管 + /api 反向代理
# 状态：未在本机验证（本机无nginx/Docker）。启用前先单独跑通本文件。
# 配套：docker-compose.yml 把 frontend/dist 挂到 /usr/share/nginx/html

server {
    listen 80;
    server_name _;

    # gzip 压缩 JS/CSS（演示产物 gzip 后 30KB，直传更小）
    gzip on;
    gzip_types text/css application/javascript application/json;

    # 前端静态资源：SPA 无路由，缺失路径统一回 index.html
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # API 反代到 app 容器（compose 内部网络服务名 app）
    location /api/ {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # 生产对外时在此终结 TLS（证书路径自行替换）
    # listen 443 ssl;
    # ssl_certificate     /etc/nginx/certs/fullchain.pem;
    # ssl_certificate_key /etc/nginx/certs/privkey.pem;
}
