# 部署形态：nginx 静态托管 + /api 反向代理 + Basic Auth 门禁（局域网/评委访问形态）
# 与 nginx.conf 的差异只有一处：放开了 auth_basic 两行。
# 启用步骤见 docker-compose.auth.yml 头注释；htpasswd 不要提交进仓库（.gitignore 已排除）。

server {
    listen 80;
    server_name _;

    # ===== 门禁（Basic Auth）：本形态默认启用 =====
    auth_basic "AI-Bid-Agent";
    auth_basic_user_file /etc/nginx/htpasswd;

    # gzip 压缩 JS/CSS
    gzip on;
    gzip_types text/css application/javascript application/json;

    # 前端静态资源：SPA 无路由，缺失路径统一回 index.html
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # API 反代到 app 容器（compose 内部网络服务名 app）
    location /api/ {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }
}
