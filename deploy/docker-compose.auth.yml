# 部署形态二：局域网/评委访问（放开 0.0.0.0 + Basic Auth 门禁）
# 前置：deploy/htpasswd 已生成（口令文件不入仓库）：
#   docker run --rm httpd:2.4-alpine htpasswd -nbB <用户名> <密码> > deploy/htpasswd
# 用法：在项目根执行（两个 -f 都要带，后者是叠加层）：
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.auth.yml up -d
# 还原默认形态（只绑回环、无门禁）：把两个 -f 都去掉，重新 up -d 即可。

services:
  nginx:
    # !override 必须带：compose 默认会"合并"两个文件的 ports（127.0.0.1:80 + 0.0.0.0:80 自相冲突）
    ports: !override
      - "0.0.0.0:80:80"
    volumes:
      - ./htpasswd:/etc/nginx/htpasswd:ro
      - ./nginx-auth.conf:/etc/nginx/conf.d/default.conf:ro
