# 部署形态示例：nginx(80) + app(uvicorn) 两服务
# 状态：未在本机验证（本机无Docker）。
# 前置：先在 frontend/ 构建产物（npm install && npm run build）
# 用法：在项目根执行  docker compose -f deploy/docker-compose.yml up --build
# 注意：compose 相对路径以本文件位置 deploy/ 为基准

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    # 不对外暴露端口，仅 nginx 经内部网络访问
    expose:
      - "8000"
    volumes:
      # 指纹库与生成的文档持久化到宿主机
      - ../data:/srv/bidagent/data
      - ../output:/srv/bidagent/output
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ../frontend/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped
