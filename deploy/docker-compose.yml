# 部署形态：nginx(80) + app(uvicorn) 两服务
# 状态：本机已实测（Docker Desktop 29.9.3 / compose v5.7.1，2026-11-27）
# 前置：先在 frontend/ 构建产物（npm install && npm run build）
# 用法：在项目根执行  docker compose -f deploy/docker-compose.yml up --build
# 注意：compose 相对路径以本文件位置 deploy/ 为基准

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    # 不对外暴露端口，仅 nginx 经内部网络访问
    expose:
      - "8000"
    volumes:
      # 指纹库与生成的文档持久化到宿主机
      - ../data:/srv/bidagent/data
      - ../output:/srv/bidagent/output
      # 凭据只在运行时挂入，镜像里没有（.dockerignore 已排除）
      - ../config/secrets.yaml:/srv/bidagent/config/secrets.yaml:ro
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      # 只绑本机回环：局域网/校园网里别人打不开，避免未鉴权接口被随手点到
      # 要给局域网访问时改成 "80:80"，并启用 nginx.conf 里的 Basic Auth 段
      - "127.0.0.1:80:80"
    volumes:
      - ../frontend/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped
